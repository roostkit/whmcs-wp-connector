name: 🐛 Bug Report
description: Report a reproducible bug or defect in WHMCS Connector
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: input
    id: version
    attributes:
      label: WHMCS Connector Version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: wp_version
    attributes:
      label: WordPress Version
      placeholder: e.g. 6.6.1
    validations:
      required: true
  - type: input
    id: php_version
    attributes:
      label: PHP Version
      placeholder: e.g. 8.2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Screenshots
      description: Please paste any PHP / WHMCS error logs or drag-and-drop screenshots here.
      render: shell
