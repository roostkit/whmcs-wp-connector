name: 💡 Feature Request
description: Suggest an idea or enhancement for WHMCS Connector
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make WHMCS Connector better? We'd love to hear your proposal!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
